# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: santa-gift-advisor
services:
    proj-default:
        endpoint: https://foundry-ai-mm-demo.services.ai.azure.com/api/projects/proj-default
        host: azure.ai.project
    santagiftadvisor:
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: SantaGiftAdvisor.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        host: azure.ai.agent
        kind: hosted
        language: csharp
        name: santagiftadvisor
        project: .
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - proj-default
